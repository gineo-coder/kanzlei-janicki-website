<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Janicki Arbeitsrecht - Webdesign Konzept</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      .tilt-card {
        transform-style: preserve-3d;
        transition: transform 0.1s ease-out;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-primary': '#003366', // Kanzlei-Blau
              'brand-light': '#FFFFFF', // Weiß
              'brand-accent': {
                DEFAULT: '#FA8C2A', // Orange
                '600': '#E17B25',
              },
              'brand-cta': '#FA8C2A', // Orange für CTA
              'brand-cta-hover': '#E17B25',
              'brand-gray': '#6c757d', // Textgrau
              'brand-dark-text': '#212529', // Dunkler Text
              'brand-heading': '#003366', // Blau für Überschriften
            },
            fontFamily: {
              'display': ['Lato', 'sans-serif'],
              'body': ['Lato', 'sans-serif'],
            },
            animation: {
              'fade-in-up': 'fade-in-up 0.8s ease-out forwards',
            },
            keyframes: {
              'fade-in-up': {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            }
          },
        },
      }
    </script>
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
</head>
  <body class="bg-white font-body text-brand-dark-text antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const cards = document.querySelectorAll('.tilt-card');
        cards.forEach(card => {
          card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const { width, height } = rect;
            const rotateX = (y / height - 0.5) * -15; // Max 7.5 deg
            const rotateY = (x / width - 0.5) * 15;  // Max 7.5 deg
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
          });
          card.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
          });
        });
      });
    </script>
  </body>
</html>
